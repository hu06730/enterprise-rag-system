[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkb"
version = "0.1.0"
description = "企业知识库 RAG 问答系统：混合检索 + 重排 + 可量化评估"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }
# 依赖的真实来源是 requirements.txt，这里只声明最小集合
dependencies = [
    "langchain==1.4.7",
    "langchain-core==1.7.3",
    "langchain-community==0.4.2",
    "langchain-openai==1.4.1",
    "langchain-text-splitters==1.1.2",
    "pymilvus==3.0.1",
    "sentence-transformers==5.6.1",
    "FlagEmbedding==1.4.2",
    "jieba==0.42.1",
    "rank-bm25==0.2.2",
    "python-dotenv==1.2.2",
    "mcp==2.3.0",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
include = ["ragkb*"]

[tool.setuptools.package-data]
ragkb = ["corpus/*.txt", "*.json"]
