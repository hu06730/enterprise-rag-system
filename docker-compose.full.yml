# 全栈一键部署：app + etcd + minio + milvus
#
# 用途：别人 clone 仓库后，不需要先准备任何数据库，一条命令起整套：
#     docker compose -f docker-compose.full.yml up -d
#
# 与 docker-compose.yml（开发版）的区别：
#   开发版  —— 复用宿主机已有的 Milvus（数据在里面），适合日常改代码
#   全栈版  —— 自带 etcd/minio/milvus，数据在命名卷里，适合交付/演示
#
# ⚠️ 两个版本都用 8000 端口，不能同时起。切换前先 down 掉另一个。

name: ragkb-full

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: >
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    # 发布到宿主机：本机的 MCP server / 本地脚本需要直连 19530
    # （容器内的 app 走服务名，不受影响）
    ports:
      - "19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      # 注意端口是 9091（metrics）。9099 是错的，会让容器永远 unhealthy。
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  app:
    build: .
    image: ragkb-api:0.1.0
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MILVUS_URI: http://milvus-standalone:19530
      MILVUS_DB_NAME: ragkb
      REFUSE_THRESHOLD: "0.2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      AUTO_INGEST_ON_START: "1"      # 空库首次启动自动入库（约 1~3 分钟）
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    depends_on:
      milvus-standalone:
        condition: service_healthy  # 探针修对了，这里才能真的等到就绪
    restart: unless-stopped
    healthcheck:
      # 不能用 curl：python:3.13-slim 镜像里没有 curl，探针会永远失败。
      # 用镜像里一定有的 python 做 HTTP 检查。
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s             # 首次要等入库完成

volumes:
  etcd_data:
  minio_data:
  milvus_data:
